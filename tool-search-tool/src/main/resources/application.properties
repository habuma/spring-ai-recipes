spring.application.name=chatloop
spring.main.web-application-type=none

logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=TRACE

spring.ai.chat.client.tool-search-advisor.enabled=true
spring.ai.chat.client.tool-search-advisor.tool-index-type=lucene

logging.level.org.springaicommunity.tool.searcher.LuceneToolSearcher=TRACE