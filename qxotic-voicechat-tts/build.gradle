plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'qxotic-voicechat'


tasks.named('bootRun') {
    standardInput = System.in
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.1.0")
    set('qxoticVersion', "0.3.1")
}

dependencies {
    implementation 'org.springframework.ai:spring-ai-session-advisor'
    implementation 'org.springframework.ai:spring-ai-autoconfigure-model-session'

    implementation 'com.qxotic:jinfer-spring-ai-spring-boot-starter'
    implementation("com.qxotic:jinfer-models-all")

    implementation 'com.qxotic:jinfer-kokoro'
    implementation 'com.qxotic:jinfer-parakeet'

    implementation("com.qxotic:jam-native")
    implementation("com.qxotic:jam-vector")

    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        mavenBom "com.qxotic:jinfer-bom:${qxoticVersion}"
    }
}

tasks.named('bootRun') {
    optimizedLaunch = false
    jvmArgs('--add-modules', 'jdk.incubator.vector')
}

tasks.named('test') {
    jvmArgs('--add-modules', 'jdk.incubator.vector')
    useJUnitPlatform()
}
